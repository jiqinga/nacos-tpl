[package]
name = "nacos-tpl"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
directories = "5.0"
walkdir = "2.5"
globset = "0.4"
tera = "1.19"
regex = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1.19"
path-absolutize = "3.1"
chrono = { version = "0.4", default-features = true }
rayon = "1.10"

# Reserved for later stages; included for convenience
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "rustls-tls", "blocking"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tempfile = "3.10"
similar = "2.4"
md5 = "0.7"
colored = "2.1"
openssl = { version = "0.9.109", features = ["vendored"] }
[dev-dependencies]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
